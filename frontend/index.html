<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strudel MCP WebSocket テスト (Vite)</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #1a1a1a;
            color: #00ff00;
            margin: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .status {
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }
        .connected { background: #2d5a2d; }
        .disconnected { background: #5a2d2d; }
        .reconnecting { background: #5a5a2d; }
        textarea, input {
            width: 100%;
            background: #2a2a2a;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 10px;
            margin: 5px 0;
            font-family: 'Courier New', monospace;
        }
        button {
            background: #00ff00;
            color: #1a1a1a;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #00cc00;
        }
        .message {
            background: #2a2a2a;
            padding: 5px;
            margin: 2px 0;
            border-left: 3px solid #00ff00;
        }
        .dev-tools {
            background: #2a2a2a;
            border: 1px solid #00ff00;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .tool-button {
            background: #00ccff;
            color: #1a1a1a;
            padding: 5px 10px;
            margin: 2px;
            font-size: 12px;
        }
        .tool-button:hover {
            background: #0099cc;
        }
        .code-editor {
            position: relative;
            background: #2a2a2a;
            border: 1px solid #00ff00;
            border-radius: 5px;
        }
        .line-numbers {
            position: absolute;
            left: 0;
            top: 0;
            width: 50px;
            background: #1f1f1f;
            color: #666;
            padding: 10px 5px;
            text-align: right;
            font-size: 14px;
            line-height: 1.5;
            border-right: 1px solid #444;
            user-select: none;
        }
        .code-textarea {
            width: 100%;
            min-height: 200px;
            background: #2a2a2a;
            color: #00ff00;
            border: none;
            padding: 10px 10px 10px 60px;
            margin: 0;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            resize: vertical;
            tab-size: 2;
        }
        .code-textarea:focus {
            outline: none;
            box-shadow: 0 0 0 2px #00ff0044;
        }
        .error-indicator {
            color: #ff4444;
            font-weight: bold;
            font-size: 12px;
        }
        .syntax-highlight {
            position: absolute;
            left: 60px;
            top: 10px;
            white-space: pre-wrap;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            pointer-events: none;
            z-index: 1;
        }
        .syntax-keyword { color: #00ffff; }
        .syntax-string { color: #ff00ff; }
        .syntax-function { color: #ffff00; }
        .syntax-number { color: #00ff00; }
        .syntax-operator { color: #ffffff; }
        .syntax-comment { color: #888888; }
        .status-panel {
            background: #1f1f1f;
            border: 1px solid #444;
            border-radius: 5px;
            padding: 10px;
            margin: 10px 0;
            font-size: 12px;
        }
        .status-success { color: #00ff00; }
        .status-warning { color: #ffff00; }
        .status-error { color: #ff4444; }
    </style>
</head>
<body>
    <div id="app">
        <div class="container">
            <h1>Strudel MCP WebSocket テスト (Vite Hot Reload) 🔥</h1>
            
            <div id="status" class="status disconnected">WebSocket: 切断されています</div>
            
            <div class="dev-tools">
                <h3>開発ツール:</h3>
                <button class="tool-button" onclick="getStrudelDocs()">Strudel Docs取得</button>
                <button class="tool-button" onclick="startChromeDevTools">Chrome DevTools起動</button>
                <button class="tool-button" onclick="takePageSnapshot">ページスナップショット</button>
                <button class="tool-button" onclick="analyzePerformance">性能分析</button>
            </div>
            
            <div>
                <h3>Strudel コード (高度なエディタ):</h3>
                <div class="code-editor">
                    <div class="line-numbers" id="lineNumbers">1</div>
                    <div class="syntax-highlight" id="syntaxHighlight"></div>
                    <textarea id="strudelCode" class="code-textarea" placeholder="ここにStrudelコードを入力..." rows="12">// 基本テスト
s("bd hh sd oh")

// 簡単なテスト
s("bd hh sd oh").rev()

// .stack() - パターンを重ねる
$: s("bd sd").stack()

// .jux() - 交互パターン
$: s("bd hh").jux()

// 複合操作
$: s("[bd <hh sd>]*2").fast(2).rev()

// 複数行 + 高度な構文
$: s("bd sd").rev()
$: s("hh oh").jux().fast(2)</textarea>
                </div>
                <div class="status-panel" id="codeStatus">
                    <div class="status-success">✓ 構文エディタ: 準備完了</div>
                    <div class="status-warning">⚠ リアルタイム検証: 有効</div>
                </div>
                <br>
                <button onclick="initAudioAndTest()">Audio初期化 & テスト</button>
                <button onclick="testSimpleSound()">シンプル音声テスト</button>
                <button onclick="executeCode()">実行</button>
                <button onclick="getCurrentPattern()">現在のパターンを取得</button>
                <button onclick="stopMusic()">音楽停止</button>
                <button onclick="clearMessages()">メッセージをクリア</button>
            </div>
            
            <div>
                <h3>メッセージログ:</h3>
                <div id="messages" style="height: 300px; overflow-y: auto; border: 1px solid #00ff00; padding: 10px;"></div>
            </div>
        </div>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
